name: Android Release Build

# Build a signed kiosk APK on demand and attach it to a GitHub Release.
#
# Triggers:
#   - Pushing a tag that matches `v*` (e.g. `v8.8.0+8800`) → builds and creates
#     a release with the APK attached.
#   - Manual run from the Actions tab (workflow_dispatch) → builds APK only,
#     uploads as workflow artifact (no GitHub Release).
#
# The build matches the toolchain pins documented in
# `docs/android-release-contract.md`:
#   Flutter 3.41.1 · AGP 8.11.1 · Gradle 8.14 · Kotlin 1.9.25 · Java 21 JBR
# (Java 21 from `temurin` is JBR-equivalent for our Gradle pipeline; the app
#  module still targets Java 17 internally — see `android/app/build.gradle.kts`.)
#
# Required GitHub Actions secrets (set under Settings → Secrets and variables →
# Actions → Repository secrets):
#
#   ANDROID_KEYSTORE_BASE64   — `base64 < upload-keystore.jks` of the private
#                               upload keystore. Whitespace is stripped on
#                               decode. Must be the same keystore used for the
#                               previous Play/sideload release; otherwise the
#                               existing kiosk app cannot upgrade in-place.
#   ANDROID_KEYSTORE_PASSWORD — keystore (`storePassword`).
#   ANDROID_KEY_PASSWORD      — key (`keyPassword`).
#   ANDROID_KEY_ALIAS         — key alias (`keyAlias`).
#   KIOSK_SUPABASE_URL        — full URL, e.g. `https://xxxxx.supabase.co`.
#                               This becomes `SUPABASE_URL` in the bundled
#                               `.env` asset that the kiosk reads via
#                               `flutter_dotenv`.
#   KIOSK_SUPABASE_ANON_KEY   — Supabase anon JWT. Public-by-design (it ends
#                               up baked into the APK regardless), but kept in
#                               GH secrets so it is not committed to source.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write   # required to create the GitHub Release on tag push.

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter (pinned 3.41.1)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: stable
          cache: true

      - name: Verify Flutter toolchain
        run: |
          flutter --version
          flutter doctor -v || true

      - name: Resolve release label
        id: meta
        run: |
          set -euo pipefail
          version_line=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          version_name="${version_line%+*}"
          version_code="${version_line#*+}"
          tag_name="${GITHUB_REF#refs/tags/}"
          if [ "${GITHUB_REF}" = "refs/tags/${tag_name}" ]; then
            release_label="${tag_name}"
          else
            release_label="ABSENKOK-v${version_name}+${version_code}-$(date -u +%Y%m%dT%H%M%SZ)"
          fi
          echo "version_name=${version_name}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${version_code}" >> "${GITHUB_OUTPUT}"
          echo "release_label=${release_label}" >> "${GITHUB_OUTPUT}"

      - name: Reconstruct kiosk .env from secrets
        env:
          KIOSK_SUPABASE_URL: ${{ secrets.KIOSK_SUPABASE_URL }}
          KIOSK_SUPABASE_ANON_KEY: ${{ secrets.KIOSK_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KIOSK_SUPABASE_URL}" ] || [ -z "${KIOSK_SUPABASE_ANON_KEY}" ]; then
            echo "ERROR: KIOSK_SUPABASE_URL or KIOSK_SUPABASE_ANON_KEY is empty." >&2
            echo "Set both as GitHub Actions secrets before triggering this workflow." >&2
            exit 1
          fi
          {
            echo "SUPABASE_URL=${KIOSK_SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${KIOSK_SUPABASE_ANON_KEY}"
          } > .env
          # Sanity: confirm the asset is exactly what `flutter_dotenv` expects.
          test -s .env
          echo "kiosk .env rebuilt ($(wc -c < .env) bytes)"

      - name: Reconstruct upload keystore from secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is empty." >&2
            exit 1
          fi
          mkdir -p android
          # Strip whitespace/newlines that some `base64` flavors introduce.
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 -d > android/upload-keystore.jks
          test -s android/upload-keystore.jks
          echo "keystore reconstructed ($(wc -c < android/upload-keystore.jks) bytes)"

      - name: Write key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for v in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!v}" ]; then
              echo "ERROR: $v is empty." >&2
              exit 1
            fi
          done
          # storeFile is resolved by android/app/build.gradle.kts via
          # `rootProject.file(...)` which is the `android/` directory, so a
          # relative path of `upload-keystore.jks` resolves to
          # `android/upload-keystore.jks`.
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF
          chmod 600 android/key.properties

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK (split per ABI)
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --build-name ${{ steps.meta.outputs.version_name }} \
            --build-number ${{ steps.meta.outputs.version_code }}

      - name: Build universal release APK
        run: |
          flutter build apk \
            --release \
            --build-name ${{ steps.meta.outputs.version_name }} \
            --build-number ${{ steps.meta.outputs.version_code }}

      - name: Stage release artifacts
        id: stage
        run: |
          set -euo pipefail
          out_dir="release-artifacts"
          mkdir -p "${out_dir}"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            base=$(basename "${apk}")
            cp "${apk}" "${out_dir}/${base%.apk}-${{ steps.meta.outputs.release_label }}.apk"
          done
          # Drop the kiosk .env.template (no real values) so kiosk owners can
          # rebuild against their own Supabase project if they fork.
          cp release/kiosk.env.example "${out_dir}/kiosk.env.example"
          ls -la "${out_dir}"
          echo "out_dir=${out_dir}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: absenkok-${{ steps.meta.outputs.release_label }}
          path: ${{ steps.stage.outputs.out_dir }}/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ABSENKOK ${{ github.ref_name }}
          body_path: release/RELEASE_NOTES_TEMPLATE.md
          draft: true   # leave draft so the maintainer can review before publish.
          fail_on_unmatched_files: true
          files: |
            ${{ steps.stage.outputs.out_dir }}/*.apk
            ${{ steps.stage.outputs.out_dir }}/kiosk.env.example
